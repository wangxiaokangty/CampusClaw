name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campusclaw_test
          POSTGRES_PASSWORD: campusclaw_test
          POSTGRES_DB: campusclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusclaw_test -d campusclaw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 仅连接本任务创建的临时测试库。
      CAMPUSCLAW_TEST_DATABASE_URL: postgresql+psycopg://campusclaw_test:campusclaw_test@127.0.0.1:5432/campusclaw_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  contract:
    name: 契约一致性（api.d.ts 与后端 OpenAPI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # 重新生成契约类型；与提交物不一致即失败（design.md D1）
      - run: npm run gen:api
        working-directory: frontend
      - name: 检查生成物与提交物一致
        run: git diff --exit-code -- frontend/types/api.d.ts
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
